version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: pg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: pg-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql-exporter
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "root:${MYSQL_ROOT_PASSWORD}@(mysql:3306)/pg"
    depends_on:
      - mysql
    restart: unless-stopped

  pg:
    # Jenkins에서 빌드 후 `docker save/load`로 EC2에 올린 로컬 이미지 태그
    image: pg-app:latest
    container_name: pg-app
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "${PG_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # Redis
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}

      # Secrets / credentials
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}

      # Flyway가 스키마를 관리하므로 Hibernate는 validate만 수행
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"

      # 카드 등록 세션 TTL
      APP_PAYMENT_CARD_REGISTER_SESSION_TTL_SECONDS: ${APP_PAYMENT_CARD_REGISTER_SESSION_TTL_SECONDS:-900}

      # 빌링키 등록 완료 웹훅(서버-서버)
      APP_BILLING_KEY_WEBHOOK_ENABLED: ${APP_BILLING_KEY_WEBHOOK_ENABLED:-true}

      # @Async Thread Pool
      SPRING_TASK_EXECUTION_POOL_CORE_SIZE: 10
      SPRING_TASK_EXECUTION_POOL_MAX_SIZE: 10
      SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY: 500

      # Actuator 엔드포인트 노출
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"

volumes:
  mysql_data:
  redis_data:

