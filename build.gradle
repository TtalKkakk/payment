plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// 단위테스트만 실행 → JaCoCo 커버리지는 단위테스트 기준만 반영
	// 통합테스트는 @Tag("Integration") 붙이고, ./gradlew integrationTest 로 별도 실행
	useJUnitPlatform {
		excludeTags 'Integration'
	}
	finalizedBy tasks.jacocoTestReport
}

def jacocoExcludes = [
	'**/PgApplication.class',
	'**/config/**',
	'**/exception/**',
	'**/*Dto.class',
	'**/*Request.class',
	'**/*Response.class',
	'**/domain/vo/**',
	'**/domain/event/**',
	'**/domain/enumerate/**'
]

jacocoTestReport {
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	violationRules {
		rule {
			limit {
				// 최소 라인 커버리지 비율 (0 = 검증 없이 통과, 리포트만 생성)
				minimum = 0
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

// 커버리지 리포트 경로 출력: ./gradlew test jacocoReportPath
tasks.register('jacocoReportPath') {
	dependsOn jacocoTestReport
	doLast {
		def report = file("${layout.buildDirectory.get()}/reports/jacoco/test/html/index.html")
		logger.quiet("Jacoco HTML report: ${report.absolutePath}")
		if (report.exists()) {
			logger.quiet("  → 브라우저에서 열거나: open \"${report.absolutePath}\"")
		}
	}
}
