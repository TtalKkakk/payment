plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.sonarqube' version '7.2.3.7755'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.retry:spring-retry:2.0.11'
	implementation 'org.springframework:spring-aspects:7.0.3'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'com.openhtmltopdf:openhtmltopdf-core:1.0.10'
	implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	compileOnly 'org.projectlombok:lombok'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'Integration'
	}
	finalizedBy tasks.jacocoTestReport
}

def jacocoExcludes = [
	'**/PgApplication.class',
	'**/common/**',
	'**/presentation/**',
	'**/domain/vo/**',
	'**/domain/event/**',
	'**/domain/enumerate/**',
	'**/adapter/**',
	'**/dto/**',
	'**/*EventListener.class'
]

jacocoTestReport {
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: jacocoExcludes)
		}))
	}
	violationRules {
		rule {
			limit {
				// 최소 라인 커버리지 비율 (0 = 검증 없이 통과, 리포트만 생성)
				minimum = 0.0
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

// ---------------------------------------------------------------------------
// SonarQube (./gradlew test sonar -Dsonar.host.url=... -Dsonar.token=...)
// ---------------------------------------------------------------------------
sonar {
	properties {
		property 'sonar.projectKey', 'pg'
		property 'sonar.projectName', 'pg'
		property 'sonar.skipCompile', 'true'
		// JaCoCo XML 리포트 (test 후 sonar 실행 시 커버리지 반영)
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}
tasks.named('sonar').configure {
	dependsOn tasks.test
}

// 커버리지 리포트 경로 출력: ./gradlew test jacocoReportPath
tasks.register('jacocoReportPath') {
	dependsOn jacocoTestReport
	doLast {
		def report = file("${layout.buildDirectory.get()}/reports/jacoco/test/html/index.html")
		logger.quiet("Jacoco HTML report: ${report.absolutePath}")
		if (report.exists()) {
			logger.quiet("  → 브라우저에서 열거나: open \"${report.absolutePath}\"")
		}
	}
}
