<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 등록</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: #1a1a1a;
            padding: 1.5rem;
        }

        .card-form-container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 8px;
            padding: 2.5rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            border: 1px solid #e5e5e5;
        }

        h1 {
            font-size: 1.375rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: -0.3px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #666666;
            margin-bottom: 0.5rem;
            letter-spacing: -0.2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            font-family: 'SF Mono', 'Consolas', monospace;
            letter-spacing: 1.5px;
            color: #1a1a1a;
            background: #ffffff;
            border: 1px solid #d1d1d1;
            border-radius: 6px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
        }

        input::placeholder {
            color: #aaaaaa;
        }

        .input-row {
            display: flex;
            gap: 1rem;
        }

        .input-row .form-group {
            flex: 1;
        }

        .expiry-cvc .form-group:first-child {
            flex: 1;
        }

        .expiry-cvc .form-group:last-child {
            flex: 0.8;
        }

        .submit-btn {
            width: 100%;
            padding: 0.9375rem 1.5rem;
            margin-top: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            color: #ffffff;
            background: #1a1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
            letter-spacing: -0.2px;
        }

        .submit-btn:hover {
            background: #333333;
        }

        .submit-btn:active {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .submit-btn.loading {
            position: relative;
            color: transparent;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            top: 50%;
            left: 50%;
            margin: -9px 0 0 -9px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .card-preview {
            margin-bottom: 2rem;
            padding: 1.25rem 1.5rem;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #e5e5e5;
        }

        .card-number-preview {
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 1rem;
            letter-spacing: 1.5px;
            margin-bottom: 1rem;
            min-height: 1.5em;
            color: #1a1a1a;
            white-space: nowrap;
            display: flex;
            flex-wrap: nowrap;
        }

        .card-number-preview .digit-group {
            flex-shrink: 0;
            margin-right: 0.5rem;
        }

        .card-number-preview .digit-group:last-child {
            margin-right: 0;
        }

        .card-meta {
            display: flex;
            gap: 2rem;
            font-size: 0.8125rem;
            color: #666666;
        }

        .error-message {
            display: block;
            font-size: 0.75rem;
            color: #666666;
            margin-top: 0.35rem;
            min-height: 1.2em;
        }

        input.error {
            border-color: #888888;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.06);
        }

        input.error + .error-message {
            color: #444444;
        }
    </style>
</head>
<body>
    <div class="card-form-container">
        <h1>카드 등록</h1>

        <div class="card-preview">
            <div class="card-number-preview" id="cardNumberPreview">
                <span class="digit-group" id="g1">····</span>
                <span class="digit-group" id="g2">····</span>
                <span class="digit-group" id="g3">····</span>
                <span class="digit-group" id="g4">····</span>
            </div>
            <div class="card-meta">
                <span id="expiryPreview">MM/YY</span>
                <span id="cvcPreview">CVC</span>
            </div>
        </div>

        <form action="/card/register" method="post" id="cardForm">
            <input type="hidden" name="token" th:value="${token}"/>
            <input type="hidden" name="cardNumber" id="cardNumberHidden"/>

            <div class="form-group">
                <label for="cardNumberDisplay">카드 번호</label>
                <input type="text"
                       id="cardNumberDisplay"
                       inputmode="numeric"
                       autocomplete="cc-number"
                       maxlength="19"
                       placeholder="0000 0000 0000 0000"
                       data-formatted=""/>
            </div>

            <div class="input-row expiry-cvc">
                <div class="form-group">
                    <label for="expiryDisplay">유효기간 (MM/YY)</label>
                    <input type="text"
                           id="expiryDisplay"
                           name="expiry"
                           inputmode="numeric"
                           autocomplete="cc-exp"
                           maxlength="5"
                           placeholder="MM/YY"
                           data-formatted=""
                           class=""
                           aria-invalid="false"
                           aria-describedby="expiryError"/>
                    <span class="error-message" id="expiryError" role="alert"></span>
                </div>
                <div class="form-group">
                    <label for="cvc">CVC</label>
                    <input type="password"
                           id="cvc"
                           name="cvc"
                           inputmode="numeric"
                           autocomplete="cc-csc"
                           maxlength="3"
                           placeholder="123"/>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">등록하기</button>
        </form>
    </div>

    <script th:inline="javascript">
        (function() {
            const cardNumberDisplay = document.getElementById('cardNumberDisplay');
            const cardNumberHidden = document.getElementById('cardNumberHidden');
            const expiryDisplay = document.getElementById('expiryDisplay');
            const cardForm = document.getElementById('cardForm');

            function validateMonth(mm) {
                if (!mm || mm.length < 2) return true;
                const m = parseInt(mm, 10);
                return m >= 1 && m <= 12;
            }

            function isValidMonthInput(partial) {
                if (partial.length === 0) return true;
                if (partial.length === 1) return partial === '0' || partial === '1';
                const m = parseInt(partial, 10);
                return m >= 1 && m <= 12;
            }

            // 카드 번호 포맷: 1234 5678 9012 3456
            cardNumberDisplay.addEventListener('input', function(e) {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 16) value = value.slice(0, 16);

                const formatted = value.replace(/(\d{4})(?=\d)/g, '$1 ');
                this.value = formatted;
                this.setAttribute('data-formatted', formatted);

                // 미리보기 업데이트
                const groups = value.match(/.{1,4}/g) || [];
                ['g1', 'g2', 'g3', 'g4'].forEach((id, i) => {
                    const el = document.getElementById(id);
                    el.textContent = (groups[i] || '').padEnd(4, '·');
                });

                cardNumberHidden.value = value;
            });

            cardNumberDisplay.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.selectionStart === this.selectionEnd) {
                    const cursorPos = this.selectionStart;
                    if (cursorPos > 0 && this.value[cursorPos - 1] === ' ') {
                        e.preventDefault();
                        this.value = this.value.slice(0, cursorPos - 1) + this.value.slice(cursorPos);
                        this.setSelectionRange(cursorPos - 1, cursorPos - 1);
                        cardNumberDisplay.dispatchEvent(new Event('input'));
                    }
                }
            });

            // 유효기간 포맷: MM/YY - MM 2자리 입력 시 '/' 자동 추가, 월(01-12) 검증
            expiryDisplay.addEventListener('input', function(e) {
                let value = this.value.replace(/\D/g, '');
                const mmPart = value.slice(0, 2);
                if (mmPart.length === 2 && !isValidMonthInput(mmPart)) {
                    value = value.slice(0, 1);
                }
                if (value.length >= 2) {
                    const mm = value.slice(0, 2);
                    const yy = value.slice(2, 4);
                    value = mm + (yy ? '/' + yy : '');
                }
                if (value.length > 5) value = value.slice(0, 5);
                this.value = value;
                this.setAttribute('data-formatted', value);

                const errorEl = document.getElementById('expiryError');
                if (value.length >= 5) {
                    const mm = value.slice(0, 2);
                    const isValid = validateMonth(mm);
                    this.classList.toggle('error', !isValid);
                    this.setAttribute('aria-invalid', !isValid);
                    errorEl.textContent = isValid ? '' : '월은 01~12 사이로 입력해 주세요.';
                } else {
                    this.classList.remove('error');
                    this.setAttribute('aria-invalid', 'false');
                    errorEl.textContent = '';
                }

                document.getElementById('expiryPreview').textContent = value || 'MM/YY';
            });

            expiryDisplay.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.endsWith('/') && this.selectionStart === this.value.length) {
                    e.preventDefault();
                    this.value = this.value.slice(0, -1);
                    expiryDisplay.dispatchEvent(new Event('input'));
                }
            });

            // CVC 미리보기 (3자리만)
            document.getElementById('cvc').addEventListener('input', function(e) {
                let v = this.value.replace(/\D/g, '');
                if (v.length > 3) v = v.slice(0, 3);
                this.value = v;
                document.getElementById('cvcPreview').textContent = v ? '•'.repeat(v.length) : 'CVC';
            });

            // 제출 전 카드 번호(숫자만) hidden에 설정 + 유효기간 검증 + 로딩 표시
            cardForm.addEventListener('submit', function(e) {
                const submitBtn = document.getElementById('submitBtn');
                const digits = cardNumberDisplay.value.replace(/\D/g, '');
                cardNumberHidden.value = digits;

                const expiryValue = expiryDisplay.value;
                const mm = expiryValue.slice(0, 2);
                if (expiryValue.length >= 5 && !validateMonth(mm)) {
                    e.preventDefault();
                    expiryDisplay.classList.add('error');
                    expiryDisplay.setAttribute('aria-invalid', 'true');
                    document.getElementById('expiryError').textContent = '월은 01~12 사이로 입력해 주세요.';
                    expiryDisplay.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.classList.add('loading');
            });
        })();
    </script>
</body>
</html>
