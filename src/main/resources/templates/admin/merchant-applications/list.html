<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가맹점 신청 목록 - 관리자</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; padding: 2rem; color: #1a1a1a; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .filter { display: flex; gap: 0.5rem; }
        .filter a { padding: 0.5rem 1rem; background: #e5e5e5; border-radius: 6px; text-decoration: none; color: #1a1a1a; font-size: 0.875rem; }
        .filter a.active { background: #1a1a1a; color: #fff; }
        .search-form { display: flex; gap: 0.5rem; }
        .search-input { padding: 0.5rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.875rem; width: 180px; }
        .search-btn { padding: 0.5rem 1rem; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; font-size: 0.875rem; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); table-layout: fixed; }
        th, td { padding: 0.875rem 1rem; text-align: left; border-bottom: 1px solid #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        th { background: #fafafa; font-weight: 600; font-size: 0.8125rem; }
        tr:hover { background: #fafafa; }
        .col-name { max-width: 160px; }
        .col-actions { overflow: visible; white-space: normal; text-overflow: clip; }
        .status { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
        .status-PENDING { background: #fff3e0; color: #e65100; }
        .status-APPROVED { background: #e8f5e9; color: #2e7d32; }
        .status-REJECTED { background: #ffebee; color: #c62828; }
        .status-CANCELLED { background: #eceff1; color: #546e7a; }
        .status-SUBSCRIPTION_ENDED { background: #e3f2fd; color: #1565c0; }
        a { color: #1a1a1a; }
        .empty { padding: 2rem; text-align: center; color: #666; background: #fff; border-radius: 8px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 0.25rem; margin-top: 1.5rem; }
        .pagination a, .pagination span { padding: 0.5rem 0.75rem; border-radius: 4px; text-decoration: none; color: #1a1a1a; font-size: 0.875rem; }
        .pagination a:hover { background: #e5e5e5; }
        .pagination .active { background: #1a1a1a; color: #fff; }
        .pagination .disabled { color: #999; cursor: default; }
    </style>
</head>
<body>
<div class="container">
    <div style="margin-bottom: 1.5rem;">
        <a th:href="@{/admin/merchants}" style="margin-right: 1rem; color: #1565c0; text-decoration: none; font-size: 0.875rem;">가맹점 목록</a>
        <form th:action="@{/admin/logout}" method="post" style="display:inline;">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" style="background:none;border:none;color:#1565c0;font-size:0.875rem;cursor:pointer;padding:0;">로그아웃</button>
        </form>
    </div>
    <h1>가맹점 신청 목록</h1>

    <div class="filter-bar">
        <div class="filter">
            <a th:href="@{/admin/merchant-applications(businessNumber=${businessNumber ?: ''})}" th:classappend="${status == null} ? 'active' : ''">전체</a>
            <a th:href="@{/admin/merchant-applications(status='PENDING', businessNumber=${businessNumber ?: ''})}" th:classappend="${status == 'PENDING'} ? 'active' : ''">심사대기</a>
            <a th:href="@{/admin/merchant-applications(status='APPROVED', businessNumber=${businessNumber ?: ''})}" th:classappend="${status == 'APPROVED'} ? 'active' : ''">승인</a>
            <a th:href="@{/admin/merchant-applications(status='REJECTED', businessNumber=${businessNumber ?: ''})}" th:classappend="${status == 'REJECTED'} ? 'active' : ''">거절</a>
            <a th:href="@{/admin/merchant-applications(status='CANCELLED', businessNumber=${businessNumber ?: ''})}" th:classappend="${status == 'CANCELLED'} ? 'active' : ''">취소</a>
            <a th:href="@{/admin/merchant-applications(status='SUBSCRIPTION_ENDED', businessNumber=${businessNumber ?: ''})}" th:classappend="${status == 'SUBSCRIPTION_ENDED'} ? 'active' : ''">구독종료</a>
        </div>
        <form class="search-form" th:action="@{/admin/merchant-applications}" method="get">
            <input type="hidden" name="status" th:value="${status} ?: ''">
            <input type="search" name="businessNumber" th:value="${businessNumber}" placeholder="사업자번호 검색" maxlength="20" class="search-input">
            <button type="submit" class="search-btn">검색</button>
        </form>
    </div>

    <table th:if="${!#lists.isEmpty(applications)}">
        <thead>
        <tr>
            <th>가맹점명</th>
            <th>사업자번호</th>
            <th>연락처</th>
            <th>이메일</th>
            <th>상태</th>
            <th>신청일시</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="app : ${applications}">
            <td class="col-name" th:text="${app.name}"></td>
            <td th:text="${app.businessNumber}"></td>
            <td th:text="${app.contactPhone}"></td>
            <td th:text="${app.contactEmail}"></td>
            <td><span th:class="'status status-' + ${app.status.name()}" th:text="${app.status.name()}"></span></td>
            <td th:text="${app.createdAt != null ? #temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></td>
            <td class="col-actions"><a th:href="${'/admin/merchant-applications/' + app.id}">상세</a></td>
        </tr>
        </tbody>
    </table>

    <div class="empty" th:if="${#lists.isEmpty(applications)}">신청 내역이 없습니다.</div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <a th:if="${startPage > 0}" th:href="@{/admin/merchant-applications(status=${status ?: ''}, businessNumber=${businessNumber ?: ''}, page=${startPage - 1})}">‹ 이전</a>
        <th:block th:each="p : ${#numbers.sequence(startPage, endPage)}">
            <a th:if="${p != page.number}" th:href="@{/admin/merchant-applications(status=${status ?: ''}, businessNumber=${businessNumber ?: ''}, page=${p})}" th:text="${p + 1}">1</a>
            <span th:if="${p == page.number}" class="active" th:text="${p + 1}">1</span>
        </th:block>
        <a th:if="${endPage < page.totalPages - 1}" th:href="@{/admin/merchant-applications(status=${status ?: ''}, businessNumber=${businessNumber ?: ''}, page=${endPage + 1})}">다음 ›</a>
    </div>
</div>
</body>
</html>
