<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #1a1a1a; }
        .login-box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        h1 { font-size: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: #444; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9375rem; }
        input:focus { outline: none; border-color: #1a1a1a; }
        .btn-login { width: 100%; padding: 0.75rem; font-size: 0.9375rem; font-weight: 500; background: #1a1a1a; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 0.5rem; }
        .btn-login:hover { background: #333; }
        .error { color: #c62828; font-size: 0.8125rem; margin-top: 1rem; text-align: center; }
        .logout-msg { color: #2e7d32; font-size: 0.8125rem; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>관리자 로그인</h1>
        <form th:action="@{/admin/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required />
            </div>
            <button type="submit" class="btn-login">로그인</button>
        </form>
        <p th:if="${param.error}" class="error">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p th:if="${param.logout}" class="logout-msg">로그아웃되었습니다.</p>
    </div>
</body>
</html>
